# Inputs mirror flake.nix, pinned to the exact revs flake.lock has locked —
# flake.lock is the single source of truth. When bumping: `nix flake update`,
# copy the new nixpkgs, rust-overlay and okf revs here, then `devenv update`
# (.github/workflows/update-locks.yml does exactly this weekly).
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/c59305bab2065cfecc4944690d9eedbb56f3a9fa
  rust-overlay:
    url: github:oxalica/rust-overlay/6a84c41e705533dcc5569ac0731f18406b4cdf86
    inputs:
      nixpkgs:
        follows: nixpkgs
  # okf, the knowledge-bundle CLI (docs/OKF) — flake.nix tracks the FlakeHub
  # "0" series; here the rev flake.lock resolved it to.
  okf:
    url: github:kriswill/okflight/26b0f908640a541315582fa49aa99ca6659c82a7
    inputs:
      nixpkgs:
        follows: nixpkgs
  # The CodeRabbit CLI (coderabbit / cr), from numtide's llm-agents.nix —
  # flake.nix tracks its main branch; here the rev flake.lock resolved it to.
  # It keeps its own nixpkgs: its package set needs a newer one than ours.
  llm-agents:
    url: github:numtide/llm-agents.nix/4e0a04f23b1113a125efb0246f57752674ade3d9
