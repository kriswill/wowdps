# Inputs mirror flake.nix, pinned to the exact revs flake.lock has locked —
# flake.lock is the single source of truth. When bumping: `nix flake update`,
# copy the new nixpkgs, rust-overlay and llm-agents revs here, then
# `devenv update` (.github/workflows/update-locks.yml does exactly this weekly).
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/fe13242281a67641c0102cdb1087f0ebe586c7df
  rust-overlay:
    url: github:oxalica/rust-overlay/550547cefc67e01a6fd11a09e4096a3c844ca840
    inputs:
      nixpkgs:
        follows: nixpkgs
  # The CodeRabbit CLI (coderabbit / cr), from numtide's llm-agents.nix —
  # flake.nix tracks its main branch; here the rev flake.lock resolved it to.
  # It keeps its own nixpkgs: its package set needs a newer one than ours.
  llm-agents:
    url: github:numtide/llm-agents.nix/8fa7ff4193be923056b342d48d5bb38466791fe1
