# Inputs mirror flake.nix, pinned to the exact revs flake.lock has locked —
# flake.lock is the single source of truth. When bumping: `nix flake update`,
# copy the new nixpkgs and rust-overlay revs here, then
# `devenv update` (.github/workflows/update-locks.yml does exactly this weekly).
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/f4a03c008967841f2a0b3cb7c436fc6fc31671f6
  rust-overlay:
    url: github:oxalica/rust-overlay/b70538330f20adc9665afa2976471eb5b85ebd1f
    inputs:
      nixpkgs:
        follows: nixpkgs
