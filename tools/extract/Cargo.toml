[package]
name = "wowdps-extract"
description = "DB2/CASC extractor generating wowdps game-data tables from a local WoW install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wowdps-core = { path = "../../crates/core" }
# Stdlib-only like this crate: the XDG base directories every per-machine
# cache resolves through (`dirs`), the creatures file seed-creatures
# writes (`creatures`), the types of the `placed` table
# gen-placed-spells writes (`placed`), and the history store's cards,
# replay tier and JSON the store reader reads (`history`, `replay`,
# `json`).
wowdps-proto = { path = "../../crates/proto" }

[[bin]]
name = "wowdps-extract"
path = "src/main.rs"

[lints]
workspace = true
