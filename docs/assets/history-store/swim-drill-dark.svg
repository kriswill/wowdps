<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="swim-drill" viewBox="0 0 960 250" role="img" aria-label="Swimlane: GetFight with a boss and Regrade">
<style>
  #swim-drill { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #swim-drill .lane { fill: #151b23; stroke: #3d444d; stroke-width: 1; }
  #swim-drill .lanet { fill: #e6edf3; font-size: 12px; font-weight: 700; }
  #swim-drill text { fill: #e6edf3; font-size: 11.5px; }
  #swim-drill .s { fill: #9198a1; font-size: 10.5px; }
  #swim-drill .act { fill: #0c2d6b; stroke: #79c0ff; stroke-width: 1; rx: 4; }
  #swim-drill .act2 { fill: #0f2916; stroke: #3fb950; stroke-width: 1; rx: 4; }
  #swim-drill .act3 { fill: #2c1a45; stroke: #d2a8ff; stroke-width: 1; rx: 4; }
  #swim-drill .arrow { stroke: #e6edf3; stroke-width: 1.3; fill: none; marker-end: url(#sd-head); }
</style>
<defs><marker id="sd-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6edf3"/></marker></defs>
<rect class="lane" x="10" y="10" width="940" height="55"/><text class="lanet" x="18" y="42">Client (MCP)</text>
<rect class="lane" x="10" y="70" width="940" height="70"/><text class="lanet" x="18" y="110">History thread</text>
<rect class="lane" x="10" y="145" width="940" height="50"/><text class="lanet" x="18" y="175">Loader pool</text>
<rect class="lane" x="10" y="200" width="940" height="45"/><text class="lanet" x="18" y="227">Disk</text>

<!-- drill -->
<rect class="act" x="120" y="20" width="170" height="36"/><text x="205" y="36" text-anchor="middle">GetFight{id, boss}</text><text class="s" x="205" y="50" text-anchor="middle">stored_fight boss="2"</text>
<path class="arrow" d="M205 56 L205 82"/>
<rect class="act2" x="120" y="82" width="170" height="48"/><text x="205" y="98" text-anchor="middle">card.bosses[boss] → meta</text><text class="s" x="205" y="112" text-anchor="middle">find log by identity among</text><text class="s" x="205" y="124" text-anchor="middle">source files; queue a load</text>
<path class="arrow" d="M205 130 L205 155"/>
<rect class="act3" x="120" y="155" width="170" height="34"/><text x="205" y="171" text-anchor="middle">parse the member's range</text><text class="s" x="205" y="184" text-anchor="middle">seeded like any lazy load</text>
<path class="arrow" d="M290 172 L330 110"/>
<rect class="act2" x="330" y="82" width="130" height="48"/><text x="395" y="98" text-anchor="middle">derived_fight()</text><text class="s" x="395" y="112" text-anchor="middle">rows / breakdown shaped</text><text class="s" x="395" y="124" text-anchor="middle">exactly like a stored one</text>
<path class="arrow" d="M395 82 L395 56"/>
<rect class="act" x="330" y="20" width="130" height="36"/><text x="395" y="36" text-anchor="middle">Fight{StoredFight}</text><text class="s" x="395" y="50" text-anchor="middle">per-boss grading, no record</text>

<!-- regrade -->
<rect class="act" x="530" y="20" width="170" height="36"/><text x="615" y="36" text-anchor="middle">Regrade{id | enc+diff | kind}</text><text class="s" x="615" y="50" text-anchor="middle">answers Regraded{queued}</text>
<path class="arrow" d="M615 56 L615 82"/>
<rect class="act2" x="530" y="82" width="170" height="48"/><text x="615" y="98" text-anchor="middle">select cards; fresh scan</text><text class="s" x="615" y="112" text-anchor="middle">Σ matches Overall metas only;</text><text class="s" x="615" y="124" text-anchor="middle">rides the import queue</text>
<path class="arrow" d="M615 130 L615 155"/>
<rect class="act3" x="530" y="155" width="170" height="34"/><text x="615" y="171" text-anchor="middle">parse</text><text class="s" x="615" y="184" text-anchor="middle">under the current rulings</text>
<path class="arrow" d="M700 172 L740 110"/>
<rect class="act2" x="740" y="82" width="200" height="48"/><text x="840" y="98" text-anchor="middle">store_impl(force)</text><text class="s" x="840" y="112" text-anchor="middle">pin carried; stale details</text><text class="s" x="840" y="124" text-anchor="middle">unlinked if no longer a kill</text>
<path class="arrow" d="M840 130 L840 210"/>
<text class="s" x="850" y="228">rewrite in place</text>
</svg>
