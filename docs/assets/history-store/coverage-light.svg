<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="coverage" viewBox="0 0 960 400" role="img" aria-label="Coverage matrix: kinds of question against the data available for kills and for wipes">
<style>
  #coverage { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #coverage text { fill: #1b1f24; font-size: 12px; }
  #coverage .h { font-weight: 700; font-size: 12px; fill: #57606a; text-transform: uppercase; letter-spacing: .04em; }
  #coverage .s { font-size: 10.5px; fill: #57606a; }
  #coverage .grid { stroke: #d0d7de; stroke-width: 1; }
  #coverage .yes { fill: #dafbe1; stroke: #1a7f37; }
  #coverage .part { fill: #fff8c5; stroke: #d4a72c; }
  #coverage .no { fill: #ffebe9; stroke: #cf222e; }
  #coverage .cell { stroke-width: 1; rx: 4; }
  #coverage .lbl { font-size: 11px; }
</style>
<text class="h" x="15" y="30">Question</text>
<text class="h" x="470" y="30" text-anchor="middle">kills · bests · pins</text>
<text class="h" x="620" y="30" text-anchor="middle">wipes</text>
<text class="h" x="770" y="30" text-anchor="middle">keys (per boss)</text>
<text class="h" x="900" y="30" text-anchor="middle">needs</text>
<line class="grid" x1="15" y1="38" x2="945" y2="38"/>

<!-- rows: y from 60 step 34 -->
<g>
<text x="15" y="64">Best / trend / rank of DPS, HPS, deaths by spec, content, build, week</text>
<rect class="cell yes" x="410" y="48" width="120" height="24"/><text class="lbl" x="470" y="64" text-anchor="middle">card</text>
<rect class="cell yes" x="560" y="48" width="120" height="24"/><text class="lbl" x="620" y="64" text-anchor="middle">card</text>
<rect class="cell part" x="710" y="48" width="120" height="24"/><text class="lbl" x="770" y="64" text-anchor="middle">Σ only</text>
<text class="s" x="900" y="64" text-anchor="middle">—</text>
</g>
<g>
<text x="15" y="98">Rank among DPS specs, share, median (the coach's "me" block)</text>
<rect class="cell yes" x="410" y="82" width="120" height="24"/><text class="lbl" x="470" y="98" text-anchor="middle">card + role lookup</text>
<rect class="cell yes" x="560" y="82" width="120" height="24"/><text class="lbl" x="620" y="98" text-anchor="middle">card + role lookup</text>
<rect class="cell part" x="710" y="82" width="120" height="24"/><text class="lbl" x="770" y="98" text-anchor="middle">drill, not SQL</text>
<text class="s" x="900" y="98" text-anchor="middle">role dim</text>
</g>
<g>
<text x="15" y="132">Loadout-conditioned comparison (which node or item differs)</text>
<rect class="cell yes" x="410" y="116" width="120" height="24"/><text class="lbl" x="470" y="132" text-anchor="middle">players ⋈ loadouts</text>
<rect class="cell yes" x="560" y="116" width="120" height="24"/><text class="lbl" x="620" y="132" text-anchor="middle">players ⋈ loadouts</text>
<rect class="cell yes" x="710" y="116" width="120" height="24"/><text class="lbl" x="770" y="132" text-anchor="middle">per key</text>
<text class="s" x="900" y="132" text-anchor="middle">item names</text>
</g>
<g>
<text x="15" y="166">Spell composition, crit rate, cast counts per spell</text>
<rect class="cell yes" x="410" y="150" width="120" height="24"/><text class="lbl" x="470" y="166" text-anchor="middle">details</text>
<rect class="cell no" x="560" y="150" width="120" height="24"/><text class="lbl" x="620" y="166" text-anchor="middle">no details</text>
<rect class="cell part" x="710" y="150" width="120" height="24"/><text class="lbl" x="770" y="166" text-anchor="middle">drill, not SQL</text>
<text class="s" x="900" y="166" text-anchor="middle">spell dim</text>
</g>
<g>
<text x="15" y="200">Opener, potion timing, lust window, damage in the first 30 s</text>
<rect class="cell yes" x="410" y="184" width="120" height="24"/><text class="lbl" x="470" y="200" text-anchor="middle">timelines + marks</text>
<rect class="cell no" x="560" y="184" width="120" height="24"/><text class="lbl" x="620" y="200" text-anchor="middle">no details</text>
<rect class="cell no" x="710" y="184" width="120" height="24"/><text class="lbl" x="770" y="200" text-anchor="middle">Σ timeline only</text>
<text class="s" x="900" y="200" text-anchor="middle">marks on rows</text>
</g>
<g>
<text x="15" y="234">Major cooldown / defensive usage ("first Meta at 0:30")</text>
<rect class="cell no" x="410" y="218" width="120" height="24"/><text class="lbl" x="470" y="234" text-anchor="middle">casts not marked</text>
<rect class="cell no" x="560" y="218" width="120" height="24"/><text class="lbl" x="620" y="234" text-anchor="middle">casts not marked</text>
<rect class="cell no" x="710" y="218" width="120" height="24"/><text class="lbl" x="770" y="234" text-anchor="middle">casts not marked</text>
<text class="s" x="900" y="234" text-anchor="middle">cooldown table</text>
</g>
<g>
<text x="15" y="268">Death cause, hp slide, attackers per death</text>
<rect class="cell yes" x="410" y="252" width="120" height="24"/><text class="lbl" x="470" y="268" text-anchor="middle">recaps</text>
<rect class="cell yes" x="560" y="252" width="120" height="24"/><text class="lbl" x="620" y="268" text-anchor="middle">recaps</text>
<rect class="cell part" x="710" y="252" width="120" height="24"/><text class="lbl" x="770" y="268" text-anchor="middle">drill, not SQL</text>
<text class="s" x="900" y="268" text-anchor="middle">—</text>
</g>
<g>
<text x="15" y="302">Damage taken by ability per player (soaks, avoidable damage)</text>
<rect class="cell no" x="410" y="286" width="120" height="24"/><text class="lbl" x="470" y="302" text-anchor="middle">dead players only</text>
<rect class="cell no" x="560" y="286" width="120" height="24"/><text class="lbl" x="620" y="302" text-anchor="middle">dead players only</text>
<rect class="cell no" x="710" y="286" width="120" height="24"/><text class="lbl" x="770" y="302" text-anchor="middle">dead players only</text>
<text class="s" x="900" y="302" text-anchor="middle">taken_spells</text>
</g>
<g>
<text x="15" y="336">Damage in boss phase N; healers only</text>
<rect class="cell no" x="410" y="320" width="120" height="24"/><text class="lbl" x="470" y="336" text-anchor="middle">no phase dim</text>
<rect class="cell no" x="560" y="320" width="120" height="24"/><text class="lbl" x="620" y="336" text-anchor="middle">no phase dim</text>
<rect class="cell no" x="710" y="320" width="120" height="24"/><text class="lbl" x="770" y="336" text-anchor="middle">no phase dim</text>
<text class="s" x="900" y="336" text-anchor="middle">phase + role dims</text>
</g>
<g>
<text x="15" y="370">Grade over time; "what closed since last night"</text>
<rect class="cell no" x="410" y="354" width="120" height="24"/><text class="lbl" x="470" y="370" text-anchor="middle">annotations unwritten</text>
<rect class="cell no" x="560" y="354" width="120" height="24"/><text class="lbl" x="620" y="370" text-anchor="middle">annotations unwritten</text>
<rect class="cell no" x="710" y="354" width="120" height="24"/><text class="lbl" x="770" y="370" text-anchor="middle">annotations unwritten</text>
<text class="s" x="900" y="370" text-anchor="middle">item 4</text>
</g>
<rect class="cell yes" x="15" y="386" width="14" height="10"/><text class="s" x="34" y="395">answerable in SQL from the lake</text>
<rect class="cell part" x="230" y="386" width="14" height="10"/><text class="s" x="249" y="395">partly: whole-key Σ, or the on-demand drill through the daemon, not SQL</text>
<rect class="cell no" x="640" y="386" width="14" height="10"/><text class="s" x="659" y="395">not stored, or no dimension to join on</text>
</svg>
