[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/core",
    "crates/proto",
    "crates/daemon",
    "crates/tui",
    "crates/gui",
    "crates/gui-logic",
    "crates/mcp",
    "crates/history",
    "crates/encounter-rubric",
    "tools/extract",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV = the toolchain the workspace is developed and CI-tested against.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kriswill/wowdps"

# Panic-capable constructs are banned in production code: a damage meter that
# aborts on a malformed log line is worse than one that skips it, and the
# daemon outlives every client that could restart it. Tests are exempted via
# clippy.toml — there a panic IS the failure mechanism.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
exit = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"

# The GUI: GPUI lays out and renders on the CPU every frame, so an
# unoptimized GPUI makes a debug build crawl. Kit's recommended set
# (kit/docs/installation.md) plus the rest of the gpui-pre family and the
# text stack. Optimization level never changes what the code computes.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-linux = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-wgpu = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
taffy = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
swash = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
# The history reader's bundled DuckDB, ~350 C++ units: no debug info. Cargo
# hands its build script DEBUG=false, so cc-rs drops -g and the build script
# defines NDEBUG, which turns DuckDB's internal assertions off as a release
# build does (DuckDB's own code, not ours: nothing here steps into it).
# Measured 2026-10-23 (24 cores): OUT_DIR 1.8 GB -> 782 MB, libduckdb.a and
# the rlib 951 -> 412 MB each, the parity test binary 594 -> 361 MB, the
# build-script run 55.5 -> 48.9 s.
libduckdb-sys = { debug = false }
