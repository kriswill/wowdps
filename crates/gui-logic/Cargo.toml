[package]
name = "wowdps-gui-logic"
description = "wowdps GUI logic shared by the iced GUI and gui-new: config, Hyprland IPC, keys, history pages, caches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# What both GUIs need and neither draws. Model + proto only, like the GUIs
# themselves, plus serde/toml for the config: no UI framework, so either
# GUI can lean on it and neither can leak its widgets into the other.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
wowdps-model = { path = "../model" }
wowdps-proto = { path = "../proto" }

# Tests only: the daemon's in-process mock over the fixture log gives the
# history pages a real store to answer them. Never a runtime dependency.
[dev-dependencies]
wowdps-daemon = { path = "../daemon" }

# The hooks a GUI's own tests call (`Config::use_path_on_this_thread` …).
# A `#[cfg(test)]` item here is compiled for THIS crate's tests only, so
# each GUI turns this on from its dev-dependency; a release build never
# carries it.
[features]
test-support = []

[lints]
workspace = true
