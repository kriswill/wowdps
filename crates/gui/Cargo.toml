[package]
name = "wowdps-gui"
description = "wowdps GUI: iced window and wlr-layer-shell overlay client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wowdps-gui"
path = "src/main.rs"

# A pure client: model + proto only. No wowdps-core — this binary cannot
# open a combat log or parse a line, and the compiler enforces it.
[dependencies]
# tokio powers `iced::time::every`, the tick that drains the daemon client.
# "image" is for the generated class/spec icon atlas (icons.rs) — raster
# support only, no image-file decoding is ever done at runtime, so the
# codec-free feature keeps every decoder (png, exr, …) out of the build.
iced = { version = "0.14", features = ["tokio", "canvas", "image-without-codecs"] }
iced_layershell = "0.19.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
wowdps-model = { path = "../model" }
wowdps-proto = { path = "../proto" }

# Tests only: the daemon's in-process mock + the fixture log give the
# rendering tests a realistic ClientState. Never a runtime dependency —
# the binary still cannot open a combat log.
[dev-dependencies]
wowdps-core = { path = "../core" }
wowdps-daemon = { path = "../daemon" }
# iced's own software renderer, already built as half of `iced::Renderer`:
# the talent viewer's tests draw its canvases headless through it (no
# window, no GPU). Same version the `iced` dependency locks.
iced_tiny_skia = { version = "0.14", features = ["geometry", "image"] }
# iced's headless test harness (Simulator over tiny-skia): renders whole
# screens without a window so the view/window/compare tests can read text.
iced_test = "0.14"

[lints]
workspace = true
