[package]
name = "wowdps-gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wowdps-gui"
path = "src/main.rs"

# A pure client: model + proto only. No wowdps-core — this binary cannot
# open a combat log or parse a line, and the compiler enforces it.
[dependencies]
# tokio powers `iced::time::every`, the tick that drains the daemon client.
iced = { version = "0.14", features = ["tokio", "canvas"] }
iced_layershell = "0.19.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
wowdps-model = { path = "../model" }
wowdps-proto = { path = "../proto" }
