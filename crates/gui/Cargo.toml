[package]
name = "wowdps-gui"
description = "wowdps GUI on GPUI Kit: the meter window and the wlr-layer-shell overlay client"
version.workspace = true
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wowdps-gui"
path = "src/main.rs"

# A pure client: model + proto (+ the shared, framework-free gui-logic) only.
# No wowdps-core — this binary cannot open a combat log or parse a line, and
# the compiler enforces it.
[dependencies]
# Pinned exactly: Kit pins its gpui-pre snapshot exactly, and a bump is its
# own deliberate change (docs/spec-gui-new.md §3). Default features only:
# `component` (the styled layer) and `assets` (its icons); no tree-sitter.
gpui-kit = "=0.7.0"
wowdps-model = { path = "../model" }
wowdps-proto = { path = "../proto" }
wowdps-gui-logic = { path = "../gui-logic" }
# Named only to build `RenderImage` frames (GPUI does not re-export the
# crate): the version gpui-pre-wgpu locks, no codecs of our own.
image = { version = "0.25.10", default-features = false }

[dev-dependencies]
# Kit's harness (TestWindowExt, HeadlessAppContext, the headless renderer)
# and the daemon's in-process mock over the committed fixtures.
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
wowdps-daemon = { path = "../daemon" }
wowdps-gui-logic = { path = "../gui-logic", features = ["test-support"] }
# PNG in and out for the render guard and the design shots: the version
# and the png codec GPUI already builds, so this adds nothing to the tree.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
