[package]
name = "wowdps-gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wowdps-gui"
path = "src/main.rs"

[dependencies]
# tokio powers `iced::time::every`, the poll that drains the tail thread.
iced = { version = "0.14", features = ["tokio"] }
iced_layershell = "0.19.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
wowdps-core = { path = "../core" }
