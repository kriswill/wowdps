[package]
name = "wowdps-gui-new"
description = "wowdps GUI on GPUI Kit: the window and the overlay, rebuilt beside the iced GUI until cutover"
version.workspace = true
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wowdps-gui-new"
path = "src/main.rs"

[dependencies]
# Pinned exactly: Kit pins its gpui-pre snapshot exactly, and a bump is its
# own deliberate change (docs/spec-gui-new.md §3). Default features only:
# `component` (the styled layer) and `assets` (its icons); no tree-sitter.
gpui-kit = "=0.7.0"
wowdps-model = { path = "../model" }
wowdps-proto = { path = "../proto" }
wowdps-gui-logic = { path = "../gui-logic" }

[lints]
workspace = true
