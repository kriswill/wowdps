[package]
name = "wowdps-tui"
description = "wowdps binary: daemon launcher and terminal meter client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The binary keeps its pre-workspace name: `cargo run --bin wowdps`.
# It is daemon + launcher + TUI client in one, so it links core transitively
# through the daemon — but the TUI client code itself only speaks proto/model
# (kept honest by tests/no_engine.rs).
[[bin]]
name = "wowdps"
path = "src/main.rs"

[dependencies]
wowdps-model = { path = "../model" }
wowdps-proto = { path = "../proto" }
wowdps-daemon = { path = "../daemon" }
wowdps-core = { path = "../core" }
crossterm = "0.29.0"
ratatui = "0.30.2"

# Tests only: keybind_parity.rs holds the TUI's keymap against the GUIs'
# chord table, compiled in rather than grepped.
[dev-dependencies]
wowdps-gui-logic = { path = "../gui-logic" }

[lints]
workspace = true
