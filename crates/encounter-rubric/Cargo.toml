[package]
name = "wowdps-encounter-rubric"
description = "The seasonal encounter rubric: per-encounter maps, views, NPCs, abilities and phases, as TOML"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The one engine-side crate that names serde/toml (signed off 2026-10-05,
# CONTRACT.md §Dependencies): the rubric is reviewed as TOML files under
# this crate's seasons/, embedded at build time, and read here for the daemon, the
# extractor and the GUI alike, none of which name serde/toml themselves.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
# Stdlib-only like the engine crates: the XDG base directories every
# per-machine cache resolves through (`dirs`), where the journal's text
# sidecars live (`text::dir`).
wowdps-proto = { path = "../proto" }

[lints]
workspace = true
