# Inside the well (Mythic): each time a Drowned Echo wakes in it, the raid
# outside takes Grasping Depths (1293214) every second and is pulled toward
# the well until the Echo is beaten. One team drops in, beats the Echo in a
# round chamber amid Swirling Spirits and Immortal Coil, and comes back up
# with Soul Exhaustion (1300235), which keeps it from going in again: two
# teams take the six Echoes in turn (five, then four, on the 10/4 kill).
#
# The log keeps the divers on the arena's map (UiMap 2606, as the game's
# own minimap does), round the well's middle: within 21 yd of it, where the
# Echo is posted: an Immortal Coil tick on a diver reads UiMap 2606, map
# 3004, at (218.9, 11.0). Inside is the arena's own floor round the well,
# phased: the same medallion, lit dark navy with the vortex round it, as an
# in-game screenshot inside shows (its floor (8, 24, 41) to (8, 31, 49)).
# So it is drawn at the arena's level by the light baked into the floor's
# vertices, which the arena's grade would turn olive. (The pit under the
# well's mouth, sand and rock down to 492, is no one's floor.) The phase's
# floor is that medallion smaller, its open mouth floored over: the divers
# stand at the rim of its dark middle, which the log puts 4.3 yd out (the
# nearest 5% of 2,052 positions, a sharp edge, none nearer but at the
# well's middle as they drop in), where the arena's mouth ends 7.6 yd out.
# Its picture is drawn at that ratio, 0.57; the phase's own geometry is
# not in the files.
# A dive is Grasping Depths coming off a player who stands in the well:
# all 27 on the kill came off within 2 yd of its middle, and the other 89
# removals (the raid's, as an Echo is beaten) found no one nearer than 15.6.
# The way is open while the Echo lives: each team's first diver went in
# 0-0.9 s before the Echo's first cast, though Grasping Depths had begun
# 6-17 s earlier. An Echo never dies in the log: it is beaten at 0%, the
# raid's Grasping Depths comes off that moment, and its team comes up with
# Soul Exhaustion 5.8 s later, all six times on the kill.
[encounter.3470.room.the-well]
name = "Inside the well"
about = "grasping-depths"
through = "soulcoil-well"
enter = [{ aura_removed = { spell = 1293214 } }]
leave = [{ aura_applied = { spell = 1300235 } }]
npc = ["drowned-echo"]
radius = 21
light = "baked"
scale = 0.57
only = ["mythic"]

