# The Malignant Cavity: the venom pool at the middle chamber's head.
# Living venoms crawl to it and burst there (Malignant Burst, a stacking
# raid DoT). None reached it on the 9/30 Heroic kill or a top guild's
# Mythic kill; at the end of the 10/5 Mythic wipes the venoms seen bursting
# stood at its rim, 14.5 and 18.9 yd from the pool's middle. The circle
# covers the pool.
[encounter.3455.place.malignant-cavity]
name = "Malignant Cavity"
kind = "pool"
tint = "green"
at = [452.6, -272.0]
radius = 20

# The fountains Vashnik drinks from with Imbibe, snake heads in the
# alcoves either side of the hall: the Fountain of Flame, whose Burning
# Venoms are first seen by it (393, -286 on 10/5 Mythic), and the Fountain
# of Shadow, whose Shrouded Venoms are first seen toward the boss from it
# (463-469, -326..-333). Every Imbibe on both kills and the 10/5 wipes
# drew from these two: the Fire and Shadow Fountain Stalkers carry its
# debuffs (1284670 and 1284671), which the log never places. No pull drew
# from the Fountain of Blood (no Clotting Venom in any log), so it is not
# placed.
#
# The tell (the user's, from the game): as a fountain erupts, the poison
# flowing from its snake's head glows, red for flame and purple for
# shadow, and so does its channel to the Cavity. A channel is the stepped
# groove running diagonally from each alcove to a bottom corner of the
# pool, ending at a green glyph: flame's at (432.1, -278.9), shadow's at
# (456.0, -289.7), where the 10/5 wipes' Shrouded Venoms burst (455.9,
# -290.6 and 454.3, -286.4): the venoms crawl to the Cavity along the
# channels. A fountain erupts as Imbibe's debuff leaves its stalker, at
# the cast's end: its Expulsion hits the raid and its venoms appear in the
# same 0.1 s (24.0, 108.0, 192.0, 276.0 and 360.0 s on the top kill). Which
# two erupt is the stalkers' debuffs, but the replay knows a trigger only
# about a unit it can place, and the log never places a stalker; so the
# moment is Imbibe's cast, which ends as they erupt: both channels glow.
[encounter.3455.event.fountains-erupt]
name = "The fountains erupt"
on = { cast = { spell = 1284663, by = "vashnik-the-malignant" } }

# The fountains' liquid, as the game shows it (the user's screenshots):
# the flow is red or violet from the basin under each snake's mouth, down
# its channel under the dark lattice, all the way to the Cavity, which
# stays green, as do the two pools beside each snake's head. The flow is
# not geometry at all: under the lattice, at 557.0-557.5, lies only the
# groove's floor at 554.6, two yards under the arena's 556.6, and the last
# yards to the Cavity are venom-green liquid. Each area wraps a fountain's
# alcove and its channel to the Cavity's rim, short of its liquid; within
# it the groove's floor and the liquid take the color, the lattice keeping
# its own, but for the snake's side pools, cut out as circles round the
# render's own regions of that liquid (half a yard to spare, 6.9 yd or
# more clear of the channel's). The colors are the screenshots': the
# flame's flow runs from (208, 69, 28) to an orange (255, 158, 65) at its
# hottest, the shadow's has no green in it at all, (89, 0, 181) to
