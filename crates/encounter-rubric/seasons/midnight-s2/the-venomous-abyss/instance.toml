# The Shattering: the raid is flung into the air and the platform cracks
# into its four quarters. The log writes no line for it. The fight runs on a
# fixed clock (on Heroic, Rage of the Shackled at 135.5 and 284.5 s,
# Circling Prey at 430.2, 481.2 and 542.2 s in every long pull), and the
# raid stops casting at 352.5–354.5 s into every Heroic pull that reached
# it: ten pulls on four nights, 353.1 s in the 9/27 kill. Mythic's clock
# runs 10 s later, and not to the tenth: on three Mythic kills the raid
# stopped at 363.0, 363.2 and 360.8 s, the last on a kill whose second rage
# landed 2.3 s early. So it is timed from that rage, which every pull
# writes: 68.5 s after it lands (68.6 s on the 9/27 kill; 68.5, 68.6 and
# 68.5 on the Mythic ones).
[encounter.3492.event.the-shattering]
name = "The Shattering"
on = { after = { secs = 68.5, since = { cast = { spell = 1286860, by = "ulatek" } }, nth = 2 } }

# Circling Prey destroys a portion of the platform and knocks back the
# players near it (the spell's text). Ula'tek casts it as 1315341, 8 s from
# start to landing.
[encounter.3492.event.circling-prey]
name = "Circling Prey"
on = { cast = { spell = 1315341, by = "ulatek" } }

