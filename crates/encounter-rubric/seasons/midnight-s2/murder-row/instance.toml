# Murder Row: written once by tools/gen-rubric.sh (build 12.1.0.69933), then tuned by hand.
schema = 2
name = "Murder Row"
kind = "dungeon"
journal = 1304
map = 2813

# The dungeon's levels, by UiMap id: each one's places and the ways between
# them, part of the base. Derived from the nineteen keystone runs stored on
# this machine by 2026-10-30 (sixteen completed, +5 to +15, Aug-Oct 2026;
# three left unfinished): a boss's court is a circle round the middle of
# the players' posts while the boss was engaged, its radius their 98th
# percentile distance from that middle and a little more; a way is the
# party's middle every 10 s between the areas, thinned by hand; the other
# places are where the party came onto or left a level. Their radii and
# the names are for the map editor to refine. The street and the terrace
# are terrain, each render cut over the ground its parties walked
# (`ground = "walked"`, every stored keystone run's posts on it); the
# warehouse is a building, cut by its own groups.
#
# Each level's pulls are the usual route's packs: who is in each (the
# instance's creatures below, one entry a member), where each member stands
# until it is pulled, and the route's order. They are cut from the runs
# alone: each run's trash units sorted by the moment they were first hurt,
# cut into pulls at gaps over 10 s, matched across runs by the pull's
# median spot, each member a creature's units standing within 6 yd of one
# another across runs, kept where 40% of the pull's runs had one; a spot
# is the median of its first posts. A route addon's map could not place
# them here (its one picture of all three levels fits no level closer than
# 15 yd), so it gives the forces values and a cross-check of composition
# only. A pull's share of the enemy forces is its members' (`Pull::forces`),
# never written: the route's pulls give 646 of 655 without the optional
# packs (98.6%: 227 on the street, 26 in the warehouse, 393 on the
# terrace) and 688 with them all; the sixteen completed runs killed 656
# to 740, so a party takes an optional pack or two.

# The dungeon's creatures outside its bosses' own tables, and the enemy
# forces each gives as it dies: the season's values as a route addon's
# data gave them on 2026-10-30 (655 since the 2026-08-18 hotfix took a
# Corrupted Warlock's pack off the terrace), checked against the stored
# runs (the sixteen completed sum to 656-740 of the 655, none under). The
# creature ids are the runs'. The bosses (Kystia Manaheart 234648, Zaen
# Bladesorrow 234649, Xathuux the Annihilator 234647, Lithiel Cinderfury
# 234763) and their own adds are their encounters' and give none; the
# Warehouse Workers and Keen Taskmasters are both the trash before Zaen
# (pulled 20-30 s before him on every run, 26 forces) and his journal's
# adds, so they are here and in his draft. The hostiles the runs killed
# that the forces data does not list (the affix's Voidbound Emissary among
# them) give none.
forces = 655

# `control = "immune"`: in the nineteen runs only slows and knocks
# (Remorseless Winter's slow, Typhoon, Ursol's Vortex) landed on these
# seven, 4 to 13 each, while the small trash beside them took 100 to 300
# stuns and incapacitates (Shadowfury, Blinding Light, Chaos Nova,
# Incapacitating Roar, Shockwave, Psychic Scream). The guides agree. The
# Keen Taskmasters and the Warehouse Workers took Chaos Nova, so they are
# not.

