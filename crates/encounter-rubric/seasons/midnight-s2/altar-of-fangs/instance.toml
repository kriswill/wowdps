# Altar of Fangs: written once by tools/gen-rubric.sh (build 12.1.0.69933), then tuned by hand.
schema = 2
name = "Altar of Fangs"
kind = "dungeon"
journal = 1322
map = 2993

# The dungeon's levels, by UiMap id: each one's places and the ways between
# them, part of the base. Derived from three completed keystone runs'
# player posts in this machine's history store: a boss's court is a circle
# round the middle of the posts while it was engaged, its radius their
# 98th percentile distance from that middle and a little more; a way is the
# party's middle every 10 s between two bosses, thinned by hand. The party
# walks every way here (2-3 yd a second through the trash, 8-12 just after a
# kill). The other places are where the party came onto or left a level.
# Their radii and the names are guesses for the map editor to refine. The
# first two levels are terrain, each render cut over the ground its parties
# walked (`ground = "walked"`, every stored keystone run's posts on it); the
# third is buildings, cut by their own groups.
#
# Each level's pulls are the usual route's packs, from the twelve completed
# keystone runs stored by 2026-10-09 (+7 to +15): who is in each (the
# instance's creatures below, one entry a member), where each member
# stands until it is pulled, and the route's order. The packs are a route
# addon's enemy groups (its pack of each enemy), placed in world yards by
# a fit of its map to the creatures' first posts, a level at a time (a
# median 9-11 yd off, about what a tank's pull drags a pack); a pull is
# the groups the runs engage together, each member's spot the median of
# the first posts matched to it on three runs or more, else the addon's
# spot. A pull's share of the enemy forces is its members' (`Pull::forces`),
# never written: the route's pulls give 858 of 817 (105%) without the
# optional one, 872 with it; the runs whose logs begin at the entrance
# killed 825-851. Packs no run or almost none took (two of the third
# level's three Ula'tek's Chosen packs, two Blades by its west wall) are
# left out.

# The dungeon's creatures outside its bosses' own tables, and the enemy
# forces each gives as it dies: the season's values as a route addon's
# data gave them on 2026-10-23, checked against the stored runs (the ten
# whose logs begin at the entrance sum to 825-851 of the 817, none under;
# the +15's and the over-time +10's logs begin in the first hall and miss
# its opening packs, 692 and 711). The creature ids are the runs'. The
# bosses (Rav'i 259445, The Writhing Coil 259446, Zul'jan 259447) and
# their own adds are their encounters' and give none. The hostiles the
# runs killed that the forces data does not list (the affix's Voidbound
# Emissary among them) give none and are not here.
forces = 817

# `control = "immune"`: in the twelve runs no stun or incapacitate landed
# on these five (two Thunderstorms, a knock back, landed on the Chieftain
# and the Harrower), while the trash beside them took 100 to 160 each
# (Shockwave, Hammer of Justice, Blinding Light, Shadowfury, Incapacitating
# Roar). Living Venom took 16 stuns and no incapacitate, too few to say:
# left at the default until proven.

