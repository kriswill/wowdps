# Ruby Life Pools: written once by tools/gen-rubric.sh (build 12.1.0.69933), then tuned by hand.
schema = 2
name = "Ruby Life Pools"
kind = "dungeon"
journal = 1202
map = 2521

# The dungeon's levels, by UiMap id: each one's places and the ways between
# them, part of the base. Derived from eleven completed keystone runs' posts
# in this machine's history store (+5 to +15). A boss's court is a circle
# round the middle of the posts while it was engaged, its radius about
# their 98th percentile distance from that middle. A trash pack's area is
# where its creatures were first posted, clustered across the runs (each
# creature's first posts within 9 yd of each other on three runs or more):
# the log writes a pack only once it is pulled, so this is where it stood
# as the tank reached it, a few yards from its spawn at most. A way is the
# party's middle every 2 s between two places, the median over the runs
# that walked it. Between the levels the party is carried in about 16 s,
# posted on no level of the dungeon's (a few posts on the continent's map,
# 1978). The lower pools are terrain, their render cut over the ground its
# parties walked (`ground = "walked"`, every stored keystone run's posts on
# it); Melidrussa's level is buildings, cut by their own groups.
#
# Each level's pulls are the usual route's packs: who is in each (the
# instance's creatures below, one entry a member), where each member
# stands until it is pulled, and the route's order. The members and their
# spots come from the creatures' first posts on the eleven runs: each
# first post laid in the area it stands in, a creature counted by its
# median number a run over the runs that pulled it there (three or more),
# its spots the middles of that many clusters of its posts. A pull's share
# of the enemy forces is its members' (`Pull::forces`), never written: the
# route's pulls give 576 of 551 (104.5%) without the Thunderhead, the
# eleven runs killed 552-605 (100.2-109.8%).
#
# A party quiet in the log travels the ways from its last post to its next
# as a ghost, the camera gliding from area to area; a jump to the other
# level flashes where it left and where it landed.

# The dungeon's creatures outside its bosses' own tables, and the enemy
# forces each gives as it dies: the season's values as a forces addon's
# data gave them on 2026-09-24, checked against the stored runs (every one
# of the eleven completed keys sums to 552-605 of the 551, none under).
# The creature ids are the runs'. The bosses (Melidrussa Chillworn 188252,
# Kokia Blazehoof 189232, Kyrakka 190484, Erkhart Stormvein 190485) are
# their encounters' and give none. The hostiles the runs killed that the
# forces data does not list (the affix's Voidbound Emissary among them)
# give none and are not here.
forces = 551

# `control = "immune"`: in the eleven runs no stun or incapacitate landed on
# these six, while ordinary trash took dozens (area stuns catch everything
# in reach). The Tempest Channeler took none either but may stand out of
# reach: left at the default until proven.

