# Ruby Life Pools: written once by tools/gen-rubric.sh (build 12.1.0.69933), then tuned by hand.
schema = 1
name = "Ruby Life Pools"
kind = "dungeon"
journal = 1202
map = 2521

# The dungeon's levels, by UiMap id: each one's places and the ways between
# them, part of the base. Derived from three completed keystone runs'
# player posts in this machine's history store: a boss's court is a circle
# round the middle of the posts while it was engaged, its radius about
# their 98th percentile distance from that middle; a way is the party's
# middle every 10 s between two bosses, thinned by hand. The party walks
# every way here (2-3 yd a second through the trash). Between the levels it
# is carried in about 16 s, posted on no level of the dungeon's (a few posts
# on the continent's map, 1978). The places that are no court, their radii
# and the names are guesses for the map editor to refine. The lower pools
# are terrain, their render cut over the ground its parties walked
# (`ground = "walked"`, every stored keystone run's posts on it);
# Melidrussa's level is buildings, cut by their own groups.

# Melidrussa Chillworn's level (the floors cache's level 2), where the run
# begins.
[level.2095.map]
floor = "ruby-life-pools-L2"

[level.2095.map.area.entrance]
shape = [{ center = [1395, -168], radius = 15 }]

[level.2095.map.area.melidrussa-court]
name = "Melidrussa Chillworn's court"
shape = [{ center = [1550, -253], radius = 35 }]
encounter = 2609

[level.2095.map.path.entrance-to-melidrussa]
from = "entrance"
to = "melidrussa-court"
points = [
    [1395, -168], [1464, -164], [1523, -136], [1585, -142],
    [1605, -168], [1575, -215], [1550, -253],
]

