# Algeth'ar Academy: written once by tools/gen-rubric.sh (build 12.1.0.69933), then tuned by hand.
schema = 1
name = "Algeth'ar Academy"
kind = "dungeon"
journal = 1201
map = 2526

# The dungeon's levels, by UiMap id: each one's places and the ways between
# them, part of the base. Derived from two completed keystone runs' player
# posts in this machine's history store: a boss's court is a circle round
# the middle of the posts while it was engaged, its radius their 98th
# percentile distance from that middle and a little more; a way is the
# party's middle every 10 s between two bosses, thinned by hand, its mode
# read from its pace. The other places are where the party stood as it came
# onto or left a level. The radii of the places that are no court, the
# names and the modes are guesses for the map editor to refine. Both levels
# are terrain, each render cut over the ground its parties walked
# (`ground = "walked"`, every stored keystone run's posts on it); the third
# (UiMap 2099) is buildings in none of the map's tiles, and draws nothing.

# The Academy's grounds (the floors cache's level 1). The run begins at the
# entrance; the Overgrown Ancient, Vexamus and Echo of Doragosa are fought
# here. The party leaves for Crawth's level from its departure, and comes
# back at its arrival, carried from Crawth's court. Its region frames 839 by
# 1,229 yd, at 6.5 px a yard; the crop keeps where its parties walk and 80
# yd past it (every 10 yd cell with three posts or more), every place below
# within it, at 8 px a yard, the minimap still under the rest.
[level.2097.map]
floor = "algethar-academy-L1"
crop = [1360, -3330, 2123, -2670]
ground = "walked"

[level.2097.map.area.entrance]
shape = [{ center = [1410, -2772], radius = 15 }]

[level.2097.map.area.overgrown-ancient-court]
name = "The Overgrown Ancient's court"
shape = [{ center = [1762, -3086], radius = 20 }]
encounter = 2563
# Overgrown Ancient (2563): 2 pulls, 180° ×1, 345° ×1
turn = 180

[level.2097.map.area.departure]
name = "Away to Crawth's level"
shape = [{ center = [1885, -3131], radius = 12 }]

[level.2097.map.area.arrival]
name = "Back from Crawth's level"
shape = [{ center = [1995, -2900], radius = 15 }]

[level.2097.map.area.vexamus-court]
name = "Vexamus's court"
shape = [{ center = [1818, -2779], radius = 32 }]
encounter = 2562

# Echo of Doragosa's draft says UiMap 2099 (the floors cache's level 3,
# whose box holds this court too), but the log posts the fight on 2097:
# every player post of it on both runs is here, none on 2099. So the
# court is on this level, an exception the embedded test names.
# Vexamus (2562): 2 pulls, 30° ×1, 45° ×1
turn = 30
[level.2097.map.area.doragosa-court]
name = "Echo of Doragosa's court"
shape = [{ center = [1480, -3194], radius = 50 }]
encounter = 2565

# The first 470 yd went at 11 yd a second on the run that has them, faster
# than the season's run: the path keeps that pace (a run with speed is a guess).
# Echo of Doragosa (2565): 2 pulls, 210° ×1, 240° ×1
turn = 210
