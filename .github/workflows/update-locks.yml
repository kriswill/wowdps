# Weekly bump of flake.lock AND the derived devenv pins in one PR:
# `nix flake update` moves flake.lock, then devenv.yaml's nixpkgs rev is
# re-pinned to the same rev and `devenv update` regenerates devenv.lock —
# flake.lock stays the single source of truth (see devenv.yaml's header).
# ci.yml's nix job on the PR proves the freshly locked package still builds.
#
# The PR is opened with a repo-scoped GitHub App token, not the default
# GITHUB_TOKEN and not a PAT: GITHUB_TOKEN-created PRs never trigger ci.yml
# (a deliberate GitHub recursion guard with no opt-out), and a PAT expires
# and is tied to a user account. The app-minted installation token lives one
# hour, is revoked when the job ends, and the PR is authored by the app's
# bot identity.
#
# One-time setup: create a GitHub App (Settings → Developer settings; no
# webhook) with repository permissions Contents R/W + Pull requests R/W,
# install it on THIS repo, then set the LOCK_APP_CLIENT_ID repo variable
# and the LOCK_APP_PRIVATE_KEY secret (generate the key on the app's
# settings page). An app already created for another repo can simply be
# installed here too.
name: update-locks

on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read # the app token, not this token, does the writing

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake update
      # The devenv CLI comes from the freshly locked nixpkgs rev, so the
      # lock it writes is the one that rev's devenv considers valid.
      - name: sync devenv pins to flake.lock
        run: |
          rev=$(jq -r '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          sed -i "s|github:NixOS/nixpkgs/[0-9a-f]*|github:NixOS/nixpkgs/$rev|" devenv.yaml
          # rust-overlay's rev is the nightly date pin (rust-toolchain.toml
          # names the channel; the overlay's manifest set picks the build).
          ro=$(jq -r '.nodes[.nodes[.root].inputs."rust-overlay"].locked.rev' flake.lock)
          sed -i "s|github:oxalica/rust-overlay/[0-9a-f]*|github:oxalica/rust-overlay/$ro|" devenv.yaml
          nix shell "github:NixOS/nixpkgs/$rev#devenv" --command devenv update
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.LOCK_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCK_APP_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Only the lock artifacts — never `.devenv/` state or anything
          # else the update run leaves in the workspace.
          add-paths: |
            flake.lock
            devenv.yaml
            devenv.lock
          commit-message: Update flake.lock and the derived devenv pins
          title: "locks: weekly update"
          body: >
            Weekly `nix flake update`, with devenv.yaml's nixpkgs rev
            re-pinned to flake.lock's and devenv.lock regenerated by
            `devenv update`. The nix CI job on this PR proves the freshly
            locked package still builds.
          branch: update-locks
          delete-branch: true
          labels: dependencies
