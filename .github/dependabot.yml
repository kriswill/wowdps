# Cargo and Actions bumps arrive as dependabot PRs; the nix side
# (flake.lock + the derived devenv pins) is deliberately NOT here — a
# flake.lock-only bump would strand devenv.yaml's mirrored nixpkgs rev, so
# .github/workflows/update-locks.yml owns all three files in one PR.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Lockfile-compatible bumps land as one PR; semver-major bumps (none
      # today — the workspace tracks tags loosely) would still arrive solo.
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # DuckDB 2.0 (duckdb / libduckdb-sys 1.20000.0, a semver-minor step
      # from 1.10506) is its own change: a new storage format and a reworked
      # C API. Bumps within DuckDB 1.x land freely.
      - dependency-name: duckdb
        versions: [">= 1.20000.0"]
      - dependency-name: libduckdb-sys
        versions: [">= 1.20000.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
